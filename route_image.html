<!DOCTYPE html>
<html>
<head>
    <title>Generating Route Image...</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: auto;
        }
        /* Wrap the map in a container that allows the map to be huge */
        #map-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 2400px;
            height: 2400px;
            z-index: -1;
            background: white;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1000;
            font-size: 1.2rem;
            text-align: center;
        }
        #output-container {
            display: none;
            text-align: center;
            padding: 20px;
            min-height: 100%;
            box-sizing: border-box;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #output-image {
            max-width: 90%;
            max-height: 80vh;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 5px solid white;
            border-radius: 4px;
        }
        .instruction {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #4a5568;
            font-weight: 500;
            background: white;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .custom-number-icon {
            background: transparent;
            border: none;
        }
    </style>
</head>
<body>
    <div id="loading">Generating high-resolution route image...<br><small style="color:#718096; font-size: 0.85em; margin-top: 10px; display: block;">This may take up to 15 seconds for a large route. Please wait.</small></div>
    
    <div id="map-wrapper">
        <div id="map"></div>
    </div>

    <div id="output-container">
        <img id="output-image" />
        <div class="instruction"><i class="fas fa-download"></i> Right-click (or long-press) the image to save it.</div>
    </div>

    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css">

    <script>
        var urlParams = new URLSearchParams(window.location.search);
        var runId = urlParams.get('id');
        
        if (!runId) {
            document.getElementById('loading').innerHTML = "Error: No route ID provided in URL.";
        } else {
            var timestamp = Date.now();
            var metaUrl = '/csv/metadata_' + runId + '.json?time=' + timestamp;
            var csvUrl = '/csv/Chapters_' + runId + '.csv?time=' + timestamp;
            
            Promise.all([
                fetch(metaUrl).then(r => r.json()),
                fetch(csvUrl).then(r => r.text())
            ]).then(([metadata, csvText]) => {
                var routeSegments = metadata.route_segments || [];
                var allCoords = [];
                
                // 1. Gather coordinates excluding the first segment (depot to first address)
                routeSegments.forEach((segment, idx) => {
                    if (idx > 0 && segment && segment.length > 0) {
                        allCoords = allCoords.concat(segment);
                    }
                });

                if (allCoords.length === 0) {
                    document.getElementById('loading').innerHTML = "Error: No valid route coordinates found.";
                    return;
                }

                var bounds = L.latLngBounds(allCoords);
                var targetZoom = 18; // Forced to Zoom 18
                
                // Temporarily create a map object just to calculate pixel dimensions at zoom 18
                var dummyMap = L.map(document.createElement('div')).setView([0,0], targetZoom);
                var nw = dummyMap.project(bounds.getNorthWest(), targetZoom);
                var se = dummyMap.project(bounds.getSouthEast(), targetZoom);
                
                // Add pixel padding so nothing touches the edges
                var paddingPx = 400; 
                var mapWidth = Math.abs(se.x - nw.x) + (paddingPx * 2);
                var mapHeight = Math.abs(se.y - nw.y) + (paddingPx * 2);
                
                // Cap canvas dimension at 28,000 to prevent crashing, but allow massive Zoom 18 maps
                var maxDimension = 28000; 
                if (mapWidth > maxDimension) {
                    var scale = maxDimension / mapWidth;
                    mapWidth = maxDimension;
                    mapHeight = mapHeight * scale;
                }
                if (mapHeight > maxDimension) {
                    var scale = maxDimension / mapHeight;
                    mapHeight = maxDimension;
                    mapWidth = mapWidth * scale;
                }
                
                document.getElementById('map-wrapper').style.width = Math.round(mapWidth) + 'px';
                document.getElementById('map-wrapper').style.height = Math.round(mapHeight) + 'px';

                // Now initialize the real map (No preferCanvas so SVGs render correctly at huge scales)
                var map = L.map('map', { 
                    zoomControl: false,
                    attributionControl: false
                });

                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19,
                    crossOrigin: true
                }).addTo(map);
                
                // Set bounds exactly, forcing the scale we calculated
                map.fitBounds(bounds, { padding: [paddingPx, paddingPx] });

                // Draw route line excluding depot segment
                routeSegments.forEach((segment, idx) => {
                    if (idx > 0 && segment && segment.length > 0) {
                        L.polyline(segment, {color: '#3182ce', weight: 8, opacity: 0.7}).addTo(map);
                    }
                });

                // Draw markers excluding depot
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        results.data.forEach((row, index) => {
                            if (index > 0 && row.Latitude && row.Longitude) {
                                var lat = parseFloat(row.Latitude);
                                var lng = parseFloat(row.Longitude);
                                
                                var size = 30;
                                var fontSize = 14;
                                var bgColor = '#e53e3e';
                                
                                var icon = L.divIcon({
                                    className: 'custom-number-icon',
                                    html: `<div style="background-color: ${bgColor}; color: white; border-radius: 50%; width: ${size}px; height: ${size}px; display: flex; align-items: center; justify-content: center; font-size: ${fontSize}px; font-weight: bold; border: 3px solid white; box-shadow: 0 0 6px rgba(0,0,0,0.5);">${index}</div>`,
                                    iconSize: [size, size],
                                    iconAnchor: [size/2, size/2]
                                });
                                
                                L.marker([lat, lng], {icon: icon}).addTo(map);
                            }
                        });

                        // Wait for all tiles on the massive canvas to load
                        setTimeout(() => {
                            var mapNode = document.getElementById('map-wrapper');
                            html2canvas(mapNode, {
                                useCORS: true,
                                allowTaint: false,
                                scale: 1,
                                backgroundColor: '#ffffff',
                                width: Math.round(mapWidth),
                                height: Math.round(mapHeight)
                            }).then(function(canvas) {
                                canvas.toBlob(function(blob) {
                                    var blobUrl = URL.createObjectURL(blob);
                                    window.location.replace(blobUrl);
                                }, "image/jpeg", 0.85);
                            }).catch(function(error) {
                                console.error('Error generating image:', error);
                                document.getElementById('loading').innerHTML = "Failed to generate image. Please check console.";
                            });
                        }, 5000); // 5 seconds wait for big map tiles
                    }
                });
            }).catch(err => {
                document.getElementById('loading').innerHTML = "Error loading route files. Ensure route exists.";
                console.error(err);
            });
        }
    </script>
</body>
</html>
