<!DOCTYPE html>
<html>
<head>
    <title>Route Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map {
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1000;
            font-size: 1.2rem;
            text-align: center;
        }
        .custom-number-icon {
            background: transparent;
            border: none;
        }
    </style>
</head>
<body>
    <div id="loading">Loading full route map...</div>
    <div id="map"></div>
    <script>
        var urlParams = new URLSearchParams(window.location.search);
        var runId = urlParams.get('id');
        
        if (!runId) {
            document.getElementById('loading').innerHTML = "Error: No route ID provided in URL.";
        } else {
            var map = L.map('map', { 
                zoomControl: true,
                attributionControl: false
            }).setView([37.9, -122.0], 12);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                crossOrigin: true
            }).addTo(map);

            var timestamp = Date.now();
            var metaUrl = '/csv/metadata_' + runId + '.json?time=' + timestamp;
            var csvUrl = '/csv/Chapters_' + runId + '.csv?time=' + timestamp;
            
            Promise.all([
                fetch(metaUrl).then(r => r.json()),
                fetch(csvUrl).then(r => r.text())
            ]).then(([metadata, csvText]) => {
                var routeSegments = metadata.route_segments || [];
                var allCoords = [];
                
                // Draw route line excluding depot segment
                routeSegments.forEach((segment, idx) => {
                    if (idx > 0 && segment && segment.length > 0) {
                        L.polyline(segment, {color: '#60a5fa', weight: 6, opacity: 0.5}).addTo(map);
                        allCoords = allCoords.concat(segment);
                    }
                });

                if (allCoords.length > 0) {
                    map.fitBounds(L.latLngBounds(allCoords), { padding: [50, 50] });
                }

                // Draw markers excluding depot
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        results.data.forEach((row, index) => {
                            if (index > 0 && row.Latitude && row.Longitude) {
                                var lat = parseFloat(row.Latitude);
                                var lng = parseFloat(row.Longitude);
                                
                                var size = 26;
                                var fontSize = 12;
                                var bgColor = '#e53e3e';
                                
                                var icon = L.divIcon({
                                    className: 'custom-number-icon',
                                    html: `<div style="background-color: ${bgColor}; color: white; border-radius: 50%; width: ${size}px; height: ${size}px; display: flex; align-items: center; justify-content: center; font-size: ${fontSize}px; font-weight: bold; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.4);">${index}</div>`,
                                    iconSize: [size, size],
                                    iconAnchor: [size/2, size/2]
                                });
                                
                                var marker = L.marker([lat, lng], {icon: icon}).addTo(map);
                                if (row.Chapter) {
                                    marker.bindPopup(`<b>Stop ${index}</b><br>${row.Chapter}`);
                                }
                            }
                        });

                        document.getElementById('loading').style.display = 'none';
                        document.title = "Explore Route - " + runId;
                    }
                });
            }).catch(err => {
                document.getElementById('loading').innerHTML = "Error loading route files. Ensure route exists.";
                console.error(err);
            });
        }
    </script>
</body>
</html>
